name: CI

on:
  push:
    branches: [main, go]
  pull_request:
    branches: [main, go]

jobs:
  lint:
    name: Lint (shellcheck)
    if: github.ref != 'refs/heads/go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          format: tty
          severity: warning
          additional_files: 'watch*.sh scripts/*.sh lib/*.sh install.sh'

  syntax-bash:
    name: Syntax (bash -n)
    if: github.ref != 'refs/heads/go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in watch*.sh scripts/*.sh lib/*.sh install.sh; do bash -n "$f" || exit 1; done

  syntax-python:
    name: Syntax (Python)
    if: github.ref != 'refs/heads/go'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile dashboard/server.py dashboard/tui.py ylu

  test:
    name: Tests (bats)
    if: github.ref != 'refs/heads/go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats --recursive tests/unit/
      - run: bats --recursive tests/integration/ || true

  test-macos:
    name: Tests (macOS)
    if: github.ref != 'refs/heads/go'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bats-core
      - run: bats --recursive tests/unit/

  version:
    name: Version check
    if: github.ref != 'refs/heads/go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=$(cat VERSION)
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || exit 1
          grep -q "$VERSION" CHANGELOG.md || exit 1

  ylu-cli:
    name: ylu CLI (smoke)
    if: github.ref != 'refs/heads/go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ylu --version
      - run: python3 ylu --help
      - run: python3 ylu watch --help

  go-build:
    name: Go (build + test)
    if: github.ref == 'refs/heads/go'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o ylu-go .

  go-cross-compile:
    name: Go (cross-compile)
    if: github.ref == 'refs/heads/go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: GOOS=linux GOARCH=amd64 go build -o ylu-linux-amd64 .
      - run: GOOS=darwin GOARCH=arm64 go build -o ylu-darwin-arm64 .
      - run: GOOS=windows GOARCH=amd64 go build -o ylu-windows-amd64.exe .
      - run: GOOS=windows GOARCH=arm64 go build -o ylu-windows-arm64.exe .
