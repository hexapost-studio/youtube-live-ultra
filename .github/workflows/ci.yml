name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          format: tty
          severity: warning
          additional_files: 'watch*.sh scripts/*.sh lib/*.sh install.sh'

  syntax-bash:
    name: Syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: for f in watch*.sh scripts/*.sh lib/*.sh install.sh; do bash -n "$f" || exit 1; done

  syntax-python:
    name: Syntax (Python)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile dashboard/server.py dashboard/tui.py ylu

  test:
    name: Tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats --recursive tests/unit/
      - run: bats --recursive tests/integration/ || true

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install bats-core
      - run: bats --recursive tests/unit/

  version:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          VERSION=$(cat VERSION)
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || exit 1
          grep -q "$VERSION" CHANGELOG.md || exit 1

  ylu-cli:
    name: ylu CLI (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 ylu --version
      - run: python3 ylu --help
      - run: python3 ylu watch --help
