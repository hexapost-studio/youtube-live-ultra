# =============================================================================
# youtube-live-ultra — config/mpv.conf
# Configuration mpv optimisée pour latence minimale sur Mac Apple Silicon (M2).
# Chargé automatiquement par mpv si placé dans ~/.config/mpv/mpv.conf
# ou passé via --include=config/mpv.conf
# =============================================================================

# ─── LOW LATENCY PROFILE ─────────────────────────────────────────────────────
profile=low-latency

# ─── DÉMULTIPLEXEUR ──────────────────────────────────────────────────────────
# Buffer minimal pour réduire la latence de lecture
cache=yes
demuxer-max-bytes=2M
demuxer-readahead-secs=0.2
demuxer-max-back-bytes=500K
cache-pause=no
cache-pause-wait=no

# ─── HACKS LATENCE ───────────────────────────────────────────────────────────
video-latency-hacks=yes
video-reversal-buffer=0
audio-buffer=0.2

# ─── SYNCHRONISATION ─────────────────────────────────────────────────────────
# audio = synchro sur l'audio (le plus fluide pour du live)
video-sync=audio
framedrop=vo
video-sync-max-video-change=5

# ─── DÉCODAGE ────────────────────────────────────────────────────────────────
vd-lavc-threads=4
vd-lavc-skiploopfilter=none
vd-lavc-fast=yes

# ─── HARDWARE DECODE — détecté automatiquement par lib/platform.sh ───────────
# Les valeurs ci-dessous sont des fallbacks. La détection réelle est faite
# par mpv_hwdec_args() dans lib/platform.sh au runtime.
hwdec=videotoolbox
vo=gpu-next
# gpu-api et gpu-context sont injectés dynamiquement selon le build mpv

# ─── AFFICHAGE ───────────────────────────────────────────────────────────────
# Désactive l'OSC (on-screen controller) — gagne quelques cycles
osc=no
osd-level=0
keep-open=no
force-window=yes
ontop=no

# ─── AUDIO ───────────────────────────────────────────────────────────────────
audio-channels=stereo
volume=80
volume-max=200

# ─── SUBTITLES ───────────────────────────────────────────────────────────────
sub-auto=no
sub-visibility=no

# ─── RÉSEAU ──────────────────────────────────────────────────────────────────
network-timeout=15
cache-secs=0
stream-buffer-size=128K

# ─── LOGGING ─────────────────────────────────────────────────────────────────
msg-level=all=warn
term-status-msg=""

# ─── STATS (touche 'i' pour voir les infos de décodage/drop) ─────────────────
# Appuyer sur Shift+I puis 2 pour voir les stats détaillées pendant le live
